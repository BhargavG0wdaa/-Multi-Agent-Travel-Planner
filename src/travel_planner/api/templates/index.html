<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flights · AI Travel Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ---- goexplore design tokens ---- */
  :root {
    --plane:   #f5f7f9;
    --surface: #ffffff;
    --ink:     #0c1a2b;
    --ink-2:   #5b6b7a;
    --muted:   #8a97a3;
    --border:  #e9edf1;
    --field:   #f5f7f9;
    --accent:  #12b5e8;       /* goexplore blue */
    --accent-deep: #0e9ecb;
    --navy:    #0a2540;
    --good:    #0a7d4f;
    --shadow: 0 1px 2px rgba(12,26,43,.04), 0 18px 40px rgba(12,26,43,.07);
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* class display rules must never beat hidden */
  html, body { margin: 0; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink); line-height: 1.5; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    /* themed goexplore backdrop: soft blue + navy glows fading into the canvas */
    background:
      radial-gradient(1100px 560px at 6% -10%, rgba(18,181,232,.18), transparent 60%),
      radial-gradient(900px 520px at 110% 2%, rgba(10,37,64,.10), transparent 55%),
      radial-gradient(760px 520px at 92% 96%, rgba(18,181,232,.10), transparent 60%),
      linear-gradient(180deg, #e8f6fb 0%, #f1fafc 32%, var(--plane) 68%);
    background-attachment: fixed;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 30px 20px 80px; position: relative; }

  /* ---- goexplore nav ---- */
  .nav { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.82);
    backdrop-filter: saturate(160%) blur(12px); border-bottom: 1px solid var(--border); }
  .navbar { padding: 0 24px; height: 68px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .logo { flex: none; white-space: nowrap;
    font-weight: 800; font-size: 22px; letter-spacing: -.02em; display: inline-flex;
    align-items: baseline; text-decoration: none; }
  .logo .go { color: var(--accent); } .logo .ex { color: var(--navy); }
  .logo sup { font-size: 9px; color: var(--muted); }
  .navlinks { flex: none; display: flex; align-items: center; gap: 20px; font-size: 14px; white-space: nowrap; }
  .navlinks a { color: #33414f; text-decoration: none; font-weight: 500; }
  .navlinks a:hover { color: var(--accent-deep); }
  .btn-navy { background: var(--navy); color: #fff !important; padding: 9px 18px;
    border-radius: 999px; font-weight: 600; font-size: 14px; transition: background .15s, transform .15s; }
  .btn-navy:hover { background: #0e3358; transform: translateY(-1px); }

  /* ---- category tabs (middle of the bar, one line; scroll if they don't fit) ---- */
  .cats { flex: 1; min-width: 0; align-self: stretch; display: flex; gap: 2px;
    overflow-x: auto; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  /* auto margins centre the tabs but, unlike justify-content:center, never hide
     the first tabs off the left edge when the row overflows */
  .cat:first-child { margin-left: auto; } .cat:last-child { margin-right: auto; }
  .cat { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; padding: 3px 11px 0; color: var(--ink-2); text-decoration: none; white-space: nowrap;
    font-size: 12.5px; font-weight: 500; line-height: 1.2;
    border-bottom: 3px solid transparent; transition: color .15s, border-color .15s; }
  .cat svg { width: 24px; height: 24px; flex: none; }
  .cat:hover { color: var(--accent-deep); }
  .cat.active { color: var(--accent-deep); border-bottom-color: var(--accent); font-weight: 600; }
  .cat:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
  /* laptops: tighten spacing so all tabs still fit on one line */
  @media (max-width: 1180px) {
    .navbar { padding: 0 16px; gap: 12px; }
    .logo { font-size: 19px; }
    .navlinks { gap: 14px; }
    .cat { padding: 3px 7px 0; font-size: 12px; }
  }
  /* phones: tabs move to their own full-width row under the logo */
  @media (max-width: 760px) {
    .navbar { flex-wrap: wrap; height: auto; padding: 12px 16px 0; row-gap: 6px; }
    .cats { order: 3; flex-basis: 100%; margin: 0 -16px; padding: 0 8px; }
    .cat { padding: 6px 10px 8px; }
  }

  /* ---- "coming soon" panel for categories not built yet ---- */
  .soon { text-align: center; padding: 48px 24px; }
  .soon-ico { width: 64px; height: 64px; margin: 0 auto 14px; display: grid; place-items: center;
    border-radius: 18px; color: var(--accent-deep);
    background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .soon-ico svg { width: 34px; height: 34px; }
  .soon h1 { margin: 10px 0 8px; }
  .soon .sub { margin-bottom: 24px; }
  .soon .btn-navy { display: inline-block; text-decoration: none; }


  h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .sub { color: var(--ink-2); margin: 0 auto; max-width: 520px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .11em;
    text-transform: uppercase; color: var(--accent-deep);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    padding: 5px 13px; border-radius: 999px; }
  .card { background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); }
  .wrap.wide { max-width: 1180px; }
  button { font: inherit; color: inherit; }

  /* ================= flight search card ================= */
  .fx { position: relative; padding: 18px 22px 46px; margin-bottom: 44px; }
  .fx-top { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; margin-bottom: 14px; }
  .trip { display: flex; gap: 6px; flex-wrap: wrap; }
  .trip label { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px;
    border-radius: 999px; cursor: pointer; font-weight: 500; color: #33414f; }
  .trip input { accent-color: var(--accent-deep); width: 16px; height: 16px; margin: 0; }
  .trip label:has(input:checked) { background: color-mix(in srgb, var(--accent) 13%, transparent);
    font-weight: 700; color: var(--ink); }
  .fx-tag { color: var(--ink-2); font-size: 14px; }

  .fx-row { display: grid; border: 1px solid var(--border); border-radius: 14px; }
  .fx-row.main { grid-template-columns: 1.35fr 1.35fr 1fr 1fr 1fr 1fr; }
  .fx-row.multi { grid-template-columns: 1.35fr 1.35fr 1fr 44px; margin-top: 10px; }
  .cell { position: relative; padding: 14px 18px 16px; border-left: 1px solid var(--border);
    cursor: pointer; min-width: 0; text-align: left; background: none; border-top: 0;
    border-right: 0; border-bottom: 0; transition: background .15s; }
  .cell:first-child { border-left: 0; border-radius: 14px 0 0 14px; }
  .cell[data-end=to] { padding-left: 30px; }        /* room for the swap button on the border */
  .cell:hover, .cell.open { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .lbl { font-size: 14px; color: var(--ink-2); display: flex; align-items: center; gap: 4px; }
  .lbl .chev { width: 14px; height: 14px; color: var(--accent-deep); }
  .val { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; margin-top: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .val small { font-size: 17px; font-weight: 600; letter-spacing: 0; }
  .val.mid { font-size: 20px; line-height: 1.25; white-space: normal; }
  .hint { font-size: 13.5px; color: var(--ink-2); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ghost { font-size: 13.5px; font-weight: 600; color: var(--muted); margin-top: 8px; line-height: 1.35; }
  .clear-ret { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 50%;
    border: 0; background: var(--field); color: var(--ink-2); cursor: pointer; font-size: 14px; line-height: 1; }
  .swap { position: absolute; z-index: 2; top: 50%; left: 0; width: 38px; height: 38px;
    transform: translate(-50%, -50%); border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); color: var(--accent-deep); cursor: pointer;
    box-shadow: 0 2px 8px rgba(12,26,43,.08); display: grid; place-items: center; }
  .swap:hover { background: #f0fbff; }
  .swap svg { width: 18px; height: 18px; }
  .date-input { position: absolute; inset: auto 0 0 0; width: 100%; height: 0; opacity: 0;
    pointer-events: none; border: 0; padding: 0; }
  .rm-leg { border: 0; border-left: 1px solid var(--border); background: none; cursor: pointer;
    color: var(--muted); font-size: 20px; border-radius: 0 14px 14px 0; }
  .rm-leg:hover { color: #c0392b; background: #fdf1f0; }
  .add-leg { margin-top: 10px; border: 1.5px dashed var(--border); background: none; border-radius: 12px;
    padding: 10px 16px; color: var(--accent-deep); font-weight: 600; cursor: pointer; }
  .add-leg:hover { border-color: var(--accent); }

  /* popovers (place search, travellers, cabin) */
  .pop { position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; min-width: 320px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 18px 50px rgba(12,26,43,.16); padding: 10px; cursor: default; }
  .pop.right { left: auto; right: 0; }
  .pop input[type=text] { width: 100%; font: inherit; font-size: 15px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--field); outline: none; }
  .pop input[type=text]:focus { border-color: var(--accent); background: #fff; }
  .sugs { list-style: none; margin: 8px 0 0; padding: 0; max-height: 300px; overflow-y: auto; }
  .sugs li { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; }
  .sugs li.hl, .sugs li:hover { background: var(--field); }
  .sugs .ico { width: 20px; height: 20px; color: var(--muted); flex: none; }
  .sugs .nm { font-weight: 600; font-size: 14.5px; }
  .sugs .ds { font-size: 12.5px; color: var(--ink-2); }
  .sugs .cd { margin-left: auto; font-weight: 700; font-size: 13px; color: var(--ink-2); }
  .sugs .msg { cursor: default; color: var(--ink-2); font-size: 13.5px; }
  .sugs .msg:hover { background: none; }
  .ctr { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 10px 6px; }
  .ctr + .ctr { border-top: 1px solid var(--border); }
  .ctr .t { font-weight: 600; } .ctr .d { font-size: 12.5px; color: var(--ink-2); }
  .step { display: flex; align-items: center; gap: 12px; }
  .step button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1; color: var(--accent-deep); }
  .step button:disabled { color: var(--muted); opacity: .5; cursor: not-allowed; }
  .step output { min-width: 16px; text-align: center; font-weight: 700; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; cursor: pointer; }
  .opt:hover { background: var(--field); }
  .opt input { accent-color: var(--accent-deep); }
  .pop .done { width: 100%; margin-top: 8px; }

  .fares { display: flex; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  .fares .ttl { font-weight: 800; line-height: 1.2; margin-right: 8px; }
  .fare { border: 1px solid var(--border); border-radius: 12px; padding: 9px 16px; cursor: pointer;
    background: var(--surface); min-width: 150px; }
  .fare input { position: absolute; opacity: 0; pointer-events: none; }
  .fare .t { font-weight: 700; display: block; } .fare .d { font-size: 13px; color: var(--ink-2); }
  .fare:has(input:checked) { border-color: var(--accent); background: #f0fbff; }
  .fare:has(input:checked) .t { color: var(--accent-deep); }
  .fare:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

  .search-btn { position: absolute; left: 50%; bottom: 0; transform: translate(-50%, 50%);
    border: 0; border-radius: 999px; padding: 15px 76px; cursor: pointer;
    font-size: 22px; font-weight: 800; letter-spacing: .06em; color: #fff;
    background: linear-gradient(90deg, #4fc3f7, var(--accent) 45%, #1d6fe0);
    box-shadow: 0 10px 26px rgba(18,120,232,.35); transition: transform .15s, box-shadow .15s; }
  .search-btn:hover { transform: translate(-50%, 50%) translateY(-1px); box-shadow: 0 14px 30px rgba(18,120,232,.42); }
  .search-btn:disabled { opacity: .7; cursor: wait; }
  .btn-navy.done { border: 0; cursor: pointer; }

  /* ================= results ================= */
  .res-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; margin-bottom: 12px; }
  .res-head h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  .res-head .meta { color: var(--ink-2); font-size: 14px; }
  .tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; cursor: pointer;
    font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
  .seg button.on { background: var(--navy); color: #fff; }
  .chk { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .chk input { accent-color: var(--accent-deep); width: 16px; height: 16px; }

  .offer { padding: 16px 20px; margin-bottom: 12px; display: grid;
    grid-template-columns: 1fr auto; gap: 12px 24px; align-items: center; }
  .offer .slices { display: grid; gap: 14px; }
  .sl { display: grid; grid-template-columns: 190px 1fr; gap: 16px; align-items: center; }
  .air { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo-b { width: 34px; height: 34px; flex: none; border-radius: 8px; border: 1px solid var(--border);
    display: grid; place-items: center; background: #fff; overflow: hidden; font-size: 11px; font-weight: 800;
    color: var(--navy); }
  .logo-b img { width: 26px; height: 26px; object-fit: contain; }
  .air .n { font-weight: 700; font-size: 14px; line-height: 1.25; }
  .air .f { font-size: 12px; color: var(--ink-2); }
  .air .op { font-size: 11.5px; color: var(--muted); }
  .times { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; }
  .tm { font-size: 22px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; }
  .tm sup { font-size: 11px; font-weight: 700; color: #c0392b; margin-left: 2px; }
  .ap { font-size: 13px; color: var(--ink-2); font-weight: 600; }
  .times .end { text-align: right; }
  .path { text-align: center; font-size: 12.5px; color: var(--ink-2); }
  .path .ln { height: 2px; background: var(--border); margin: 5px 0; position: relative; border-radius: 2px; }
  .path .ln i { position: absolute; top: -3px; width: 8px; height: 8px; border-radius: 50%;
    background: #fff; border: 2px solid #eda100; transform: translateX(-50%); }
  .path .st { font-weight: 600; } .path .st.ns { color: var(--good); }
  .price { text-align: right; }
  .price .amt { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
  .price .per { font-size: 12px; color: var(--ink-2); }
  .price .orig { font-size: 11.5px; color: var(--muted); margin-top: 1px; cursor: help; }
  .more { grid-column: 1 / -1; border: 0; background: none; padding: 0; cursor: pointer; justify-self: start;
    color: var(--accent-deep); font-weight: 600; font-size: 13px; }
  .details { grid-column: 1 / -1; border-top: 1px solid var(--border); padding-top: 10px; display: grid; gap: 8px; }
  .dseg { display: grid; grid-template-columns: 120px 1fr auto; gap: 12px; font-size: 13.5px; }
  .dseg .c { color: var(--ink-2); }
  .skel { height: 96px; margin-bottom: 12px; border-radius: var(--radius);
    background: linear-gradient(90deg, #eef2f5 25%, #f7f9fb 50%, #eef2f5 75%); background-size: 200% 100%;
    animation: sh 1.3s infinite linear; }
  @keyframes sh { to { background-position: -200% 0; } }
  .state { text-align: center; padding: 34px 20px; color: var(--ink-2); }
  .state .err { color: #b3261e; font-weight: 600; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; }

  @media (max-width: 980px) {
    .fx-row.main { grid-template-columns: 1fr 1fr; }
    .fx-row.main .cell:nth-child(n+3) { border-top: 1px solid var(--border); }
    .fx-row.main .cell:nth-child(odd) { border-left: 0; }
    .cell:first-child { border-radius: 14px 0 0 0; }
    .fx-row.multi { grid-template-columns: 1fr 1fr; }
    .fx-row.multi .cell:nth-child(3) { grid-column: 1 / 2; border-left: 0; border-top: 1px solid var(--border); }
    .fx-row.multi .rm-leg { border-top: 1px solid var(--border); border-radius: 0 0 14px 0; }
    .sl { grid-template-columns: 1fr; gap: 8px; }
  }
  @media (max-width: 560px) {
    .fx { padding: 14px 14px 44px; }
    .val { font-size: 22px; } .val small { font-size: 14px; }
    .cell { padding: 12px 12px 14px; }
    .pop { min-width: 0; width: calc(100vw - 40px); }
    .offer { grid-template-columns: 1fr; }
    .price { text-align: left; display: flex; align-items: baseline; gap: 8px; }
    .search-btn { padding: 13px 54px; font-size: 19px; }
    .fares .ttl { flex-basis: 100%; }
    .fare { flex: 1; min-width: 0; }
    .dseg { grid-template-columns: 1fr; gap: 2px; }
  }
</style>
</head>
<body>
<header class="nav">
  <div class="navbar">
    <a class="logo" href="#"><span class="go">AI</span>&nbsp;<span class="ex">Travel Planner</span></a>
    <nav class="cats" id="cats" aria-label="Travel categories"></nav>
    <nav class="navlinks">
      <a href="#">Home</a>
      <a href="#" id="logout" class="btn-navy">Log out</a>
    </nav>
  </div>
</header>

<main class="wrap wide" id="view-flights">
  <form class="card fx" id="fx" autocomplete="off" novalidate>
    <div class="fx-top">
      <div class="trip" role="radiogroup" aria-label="Trip type">
        <label><input type="radio" name="trip" value="oneway" checked /> One Way</label>
        <label><input type="radio" name="trip" value="round" /> Round Trip</label>
        <label><input type="radio" name="trip" value="multi" /> Multi City</label>
      </div>
      <div class="fx-tag">Book international and domestic flights</div>
    </div>

    <div id="rows"></div>

    <div class="fares" role="radiogroup" aria-label="Special fare">
      <div class="ttl">Select a<br />special fare</div>
      <label class="fare"><input type="radio" name="fare" value="regular" checked />
        <span class="t">Regular</span><span class="d">Regular fares</span></label>
      <label class="fare"><input type="radio" name="fare" value="student" />
        <span class="t">Student</span><span class="d">Where airlines offer them</span></label>
    </div>

    <button class="search-btn" id="searchBtn" type="submit">SEARCH</button>
  </form>

  <section id="results" aria-live="polite"></section>
  <footer>Flight data from Duffel · test mode, no real tickets are booked ·
    INR prices are estimates at daily exchange rates</footer>
</main>

<div class="wrap" id="view-category" hidden>
  <div class="card soon">
    <div class="soon-ico" id="soonIco"></div>
    <span class="badge">Coming soon</span>
    <h1 id="soonTitle"></h1>
    <p class="sub" id="soonText"></p>
    <a href="#" class="btn-navy">Back to flights</a>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---- category tabs + views (hash routing: #hotels, #trains, ...; empty or #flights = flights) ----
  // Line icons, drawn with currentColor so the active tab tints them.
  const ICONS = {
    plane: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
    hotel: '<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4M10 10h4M10 14h4M10 18h4"/>',
    home:  '<path d="M3 10a2 2 0 0 1 .7-1.5l7-6a2 2 0 0 1 2.6 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>',
    beach: '<path d="M21 11a9 9 0 0 0-18 0Z"/><path d="M12 11v8.5"/><path d="M12 2v0"/><path d="M3 21c2-1.3 4-1.3 6 0s4 1.3 6 0 4-1.3 6 0"/>',
    train: '<path d="M9 19c-2.8 0-5-2.2-5-5V9a7 7 0 0 1 16 0v5c0 2.8-2.2 5-5 5Z"/><path d="M8 3.5V7a4 4 0 0 0 8 0V3.5"/><path d="m9 15-1-1M15 15l1-1M8 19l-2 3M16 19l2 3"/>',
    bus:   '<path d="M8 6v6M15 6v6M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2s-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/>',
    cab:   '<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/><path d="M8 7V4.5h4V7"/>',
    balloon: '<path d="M12 2a6.5 6.5 0 0 0-6.5 6.5c0 3.6 3 6 4.3 8h4.4c1.3-2 4.3-4.4 4.3-8A6.5 6.5 0 0 0 12 2Z"/><path d="M12 2c-1.8 1.7-2.6 4-2.6 6.5 0 3 .9 5.9 1.4 8M12 2c1.8 1.7 2.6 4 2.6 6.5 0 3-.9 5.9-1.4 8"/><path d="M10 16.5v2M14 16.5v2"/><rect x="10" y="18.5" width="4" height="3" rx=".6"/>',
  };
  const svg = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

  // One entry per tab. A tab without "soon" text has its own view (flights = the home view).
  const CATEGORIES = [
    { id: "flights",  label: "Flights",             icon: "plane", },
    { id: "hotels",   label: "Hotels",              icon: "hotel",   soon: "Find hotels by area, price and rating, and see how each one fits your lodging budget." },
    { id: "homestays",label: "Homestays & Villas",  icon: "home",    soon: "Browse homestays and villas for longer stays, families and groups." },
    { id: "packages", label: "Holiday Packages",    icon: "beach",   soon: "Ready-made holiday packages that bundle travel, stay and activities." },
    { id: "trains",   label: "Trains",              icon: "train",   soon: "Look up trains and classes between Indian cities and estimate fares." },
    { id: "buses",    label: "Buses",               icon: "bus",     soon: "Find intercity bus routes and operators for short hops." },
    { id: "cabs",     label: "Cabs",                icon: "cab",     soon: "Estimate cab fares for airport transfers and outstation trips." },
    { id: "tours",    label: "Tours & Attractions", icon: "balloon", soon: "Discover tours, tickets and attractions at your destination." },
  ];

  $("cats").innerHTML = CATEGORIES.map(c =>
    `<a class="cat" href="#${c.id}" data-cat="${c.id}">${svg(c.icon)}<span>${c.label}</span></a>`).join("");


  // ================= flight search =================
  const UI = {
    chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
    swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h15l-4-4M20 16H5l4 4"/></svg>',
  };

  // Shown before the user types, and usable even without the Duffel token.
  const POPULAR = [
    { code: "BLR", city: "Bengaluru", name: "Kempegowda International Airport", type: "airport", country: "IN" },
    { code: "DEL", city: "New Delhi", name: "Indira Gandhi International Airport", type: "airport", country: "IN" },
    { code: "BOM", city: "Mumbai", name: "Chhatrapati Shivaji Maharaj International Airport", type: "airport", country: "IN" },
    { code: "MAA", city: "Chennai", name: "Chennai International Airport", type: "airport", country: "IN" },
    { code: "HYD", city: "Hyderabad", name: "Rajiv Gandhi International Airport", type: "airport", country: "IN" },
    { code: "CCU", city: "Kolkata", name: "Netaji Subhas Chandra Bose International Airport", type: "airport", country: "IN" },
    { code: "GOI", city: "Goa", name: "Dabolim Airport", type: "airport", country: "IN" },
    { code: "DXB", city: "Dubai", name: "Dubai International Airport", type: "airport", country: "AE" },
    { code: "SIN", city: "Singapore", name: "Changi Airport", type: "airport", country: "SG" },
    { code: "LHR", city: "London", name: "Heathrow Airport", type: "airport", country: "GB" },
  ];
  const CABIN = { economy: "Economy", premium_economy: "Premium Economy", business: "Business", first: "First" };

  // ---- dates are plain "YYYY-MM-DD" strings, always in local time ----
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const TODAY = iso(new Date());
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const dayName = s => parse(s).toLocaleDateString("en-US", { weekday: "long" });
  const shortDate = s => parse(s).toLocaleDateString("en-US", { weekday: "short", day: "numeric", month: "short" });

  // ---- the whole form lives in one state object; renderRows() draws it ----
  const S = {
    trip: "oneway",                       // oneway | round | multi
    legs: [{ from: POPULAR[0], to: POPULAR[1], date: addDays(TODAY, 7) }],
    ret: null,                            // return date (round trip only)
    adults: 1, children: 0, infants: 0,
    cabin: "economy",
  };

  const paxTotal = () => S.adults + S.children + S.infants;
  function paxText() {
    const p = [];
    p.push(`${S.adults} Adult${S.adults > 1 ? "s" : ""}`);
    if (S.children) p.push(`${S.children} Child${S.children > 1 ? "ren" : ""}`);
    if (S.infants) p.push(`${S.infants} Infant${S.infants > 1 ? "s" : ""}`);
    return p.join(", ");
  }

  function placeCell(i, end) {
    const p = S.legs[i][end];
    const swap = end === "to"
      ? `<button type="button" class="swap" data-act="swap" data-leg="${i}" aria-label="Swap From and To">${UI.swap}</button>` : "";
    const body = p
      ? `<div class="val">${esc(p.city)}</div><div class="hint">${esc(p.code)}, ${esc(p.name)}</div>`
      : `<div class="val" style="color:var(--muted)">Select city</div><div class="hint">Airport or city</div>`;
    return `<div class="cell" role="button" tabindex="0" data-act="place" data-leg="${i}" data-end="${end}">
      ${swap}<div class="lbl">${end === "from" ? "From" : "To"}</div>${body}</div>`;
  }

  function dateCell(i) {
    const d = S.legs[i].date, min = i ? S.legs[i - 1].date : TODAY;
    const [, m, day] = d.split("-");
    return `<div class="cell" role="button" tabindex="0" data-act="date">
      <div class="lbl">Departure ${UI.chev}</div>
      <div class="val">${+day} <small>${MON[+m - 1]}'${d.slice(2, 4)}</small></div>
      <div class="hint">${dayName(d)}</div>
      <input type="date" class="date-input" data-leg="${i}" value="${d}" min="${min}" tabindex="-1" aria-label="Departure date" /></div>`;
  }

  function returnCell() {
    const r = S.ret, min = S.legs[0].date;
    const body = r
      ? (() => { const [, m, day] = r.split("-");
          return `<button type="button" class="clear-ret" data-act="clear-ret" aria-label="Remove return">×</button>
            <div class="val">${+day} <small>${MON[+m - 1]}'${r.slice(2, 4)}</small></div><div class="hint">${dayName(r)}</div>`; })()
      : `<div class="ghost">Tap to add a return date</div>`;
    return `<div class="cell" role="button" tabindex="0" data-act="date">
      <div class="lbl">Return ${UI.chev}</div>${body}
      <input type="date" class="date-input" data-ret="1" value="${r || ""}" min="${min}" tabindex="-1" aria-label="Return date" /></div>`;
  }

  const paxCell = () => `<div class="cell" role="button" tabindex="0" data-act="pax">
      <div class="lbl">Travellers ${UI.chev}</div>
      <div class="val" id="paxVal">${paxTotal()}</div>
      <div class="hint" id="paxHint">${paxTotal() === S.adults ? (S.adults > 1 ? "Adults" : "Adult") : "Travellers"}</div></div>`;

  const cabinCell = () => `<div class="cell" role="button" tabindex="0" data-act="cabin">
      <div class="lbl">Cabin Class ${UI.chev}</div><div class="val mid" id="cabinVal">${CABIN[S.cabin]}</div></div>`;

  function renderRows() {
    const multi = S.trip === "multi";
    let html = `<div class="fx-row main" style="${multi ? "grid-template-columns:1.35fr 1.35fr 1fr 1fr 1fr" : ""}">
      ${placeCell(0, "from")}${placeCell(0, "to")}${dateCell(0)}${multi ? "" : returnCell()}${paxCell()}${cabinCell()}</div>`;
    if (multi) {
      for (let i = 1; i < S.legs.length; i++) {
        html += `<div class="fx-row multi">${placeCell(i, "from")}${placeCell(i, "to")}${dateCell(i)}
          <button type="button" class="rm-leg" data-act="rm-leg" data-leg="${i}" aria-label="Remove flight ${i + 1}"
            ${S.legs.length <= 2 ? "disabled style='visibility:hidden'" : ""}>×</button></div>`;
      }
      if (S.legs.length < 5) html += `<button type="button" class="add-leg" data-act="add-leg">+ Add another city</button>`;
    }
    $("rows").innerHTML = html;
  }

  function setTrip(trip) {
    S.trip = trip;
    document.querySelector(`input[name=trip][value=${trip}]`).checked = true;
    if (trip !== "round") S.ret = null;
    if (trip === "round" && !S.ret) S.ret = addDays(S.legs[0].date, 3);
    if (trip === "multi" && S.legs.length < 2)
      S.legs.push({ from: S.legs[0].to, to: null, date: addDays(S.legs[0].date, 2) });
    if (trip !== "multi") S.legs = [S.legs[0]];
    renderRows();
  }
  document.querySelectorAll("input[name=trip]").forEach(r => r.onchange = () => setTrip(r.value));

  // ---- popovers: one at a time, anchored inside the clicked cell ----
  let pop = null;
  function closePop() {
    if (!pop) return;
    pop.cell.classList.remove("open");
    pop.el.remove();
    pop = null;
  }
  function openPop(cell, html, right = false) {
    closePop();
    const el = document.createElement("div");
    el.className = "pop" + (right ? " right" : "");
    el.innerHTML = html;
    cell.appendChild(el);
    cell.classList.add("open");
    pop = { el, cell };
    return el;
  }
  document.addEventListener("mousedown", e => { if (pop && !pop.cell.contains(e.target)) closePop(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && pop) { const c = pop.cell; closePop(); c.focus(); } });

  // Place search: popular list first, then live Duffel suggestions as you type.
  const suggestCache = {};
  function placePop(cell, i, end) {
    const el = openPop(cell, `<input type="text" placeholder="Type a city or airport" aria-label="${end === "from" ? "From" : "To"}" />
      <ul class="sugs" role="listbox"></ul>`);
    const input = el.querySelector("input"), list = el.querySelector("ul");
    let items = [], hl = 0, timer = null, note = "";

    const draw = () => {
      const q = input.value.trim().toUpperCase();
      const opts = [...items];
      if (/^[A-Z]{3}$/.test(q) && !opts.some(p => p.code === q))
        opts.push({ code: q, city: q, name: "Use this airport code", type: "code" });
      items = opts;
      hl = Math.min(hl, Math.max(opts.length - 1, 0));
      list.innerHTML = (note ? `<li class="msg">${esc(note)}</li>` : "") + (opts.length ? opts.map((p, k) => `
        <li role="option" data-k="${k}" class="${k === hl ? "hl" : ""}">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[p.type === "city" ? "hotel" : "plane"]}</svg>
          <div><div class="nm">${esc(p.city)}${p.country ? `, ${esc(p.country)}` : ""}</div><div class="ds">${esc(p.name)}</div></div>
          <span class="cd">${esc(p.code)}</span></li>`).join("")
        : (input.value.trim().length >= 2 && !note ? `<li class="msg">No airports found. Try another name or a 3-letter code.</li>` : ""));
    };
    const pick = p => {
      const place = { code: p.code, city: p.city, name: p.type === "code" ? p.code : p.name, type: p.type };
      S.legs[i][end] = place;
      if (end === "to" && S.legs[i + 1] && !S.legs[i + 1].from) S.legs[i + 1].from = place;
      closePop(); renderRows();
      if (end === "from" && !S.legs[i].to) document.querySelector(`[data-act=place][data-leg="${i}"][data-end=to]`)?.click();
    };
    const search = async () => {
      const q = input.value.trim().toLowerCase();
      note = "";
      if (q.length < 2) { items = POPULAR.filter(p => p.city.toLowerCase().startsWith(q) || !q); draw(); return; }
      if (!suggestCache[q]) {
        try {
          const r = await fetch("/api/places?q=" + encodeURIComponent(q));
          const d = await r.json();
          if (!r.ok) { note = "Live airport search isn't set up yet. You can still type a 3-letter airport code."; }
          suggestCache[q] = d.places || [];
        } catch (_) { suggestCache[q] = []; }
      }
      if (input.value.trim().toLowerCase() !== q) return;          // a newer keystroke won
      const local = POPULAR.filter(p => (p.city + " " + p.code).toLowerCase().includes(q));
      const live = suggestCache[q];
      items = live.length ? live : local;
      hl = 0; draw();
    };
    input.oninput = () => { clearTimeout(timer); timer = setTimeout(search, 200); };
    input.onkeydown = e => {
      if (e.key === "ArrowDown") { hl = Math.min(hl + 1, items.length - 1); draw(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { hl = Math.max(hl - 1, 0); draw(); e.preventDefault(); }
      else if (e.key === "Enter") { e.preventDefault(); if (items[hl]) pick(items[hl]); }
    };
    list.onmousedown = e => { const li = e.target.closest("li[data-k]"); if (li) { e.preventDefault(); pick(items[+li.dataset.k]); } };
    items = POPULAR; draw(); input.focus();
  }

  function paxPop(cell) {
    const rows = [
      ["adults", "Adults", "12 years and above"],
      ["children", "Children", "2 to 11 years"],
      ["infants", "Infants", "Under 2 years, on an adult's lap"],
    ];
    const el = openPop(cell, rows.map(([k, t, d]) => `<div class="ctr"><div><div class="t">${t}</div><div class="d">${d}</div></div>
      <div class="step"><button type="button" data-k="${k}" data-d="-1" aria-label="Fewer ${t}">−</button>
      <output data-o="${k}">${S[k]}</output>
      <button type="button" data-k="${k}" data-d="1" aria-label="More ${t}">+</button></div></div>`).join("")
      + `<button type="button" class="btn-navy done">Done</button>`, true);
    const sync = () => {
      rows.forEach(([k]) => {
        el.querySelector(`[data-o=${k}]`).textContent = S[k];
        const min = k === "adults" ? 1 : 0;
        const max = k === "infants" ? S.adults : 9;
        el.querySelector(`[data-k=${k}][data-d="-1"]`).disabled = S[k] <= min;
        el.querySelector(`[data-k=${k}][data-d="1"]`).disabled = S[k] >= max || paxTotal() >= 9;
      });
      $("paxVal").textContent = paxTotal();
      $("paxHint").textContent = paxTotal() === S.adults ? (S.adults > 1 ? "Adults" : "Adult") : "Travellers";
    };
    el.onclick = e => {
      const b = e.target.closest("button[data-k]");
      if (b) { S[b.dataset.k] += +b.dataset.d; S.infants = Math.min(S.infants, S.adults); sync(); }
      if (e.target.closest(".done")) closePop();
    };
    sync();
  }

  function cabinPop(cell) {
    const el = openPop(cell, Object.entries(CABIN).map(([k, t]) =>
      `<label class="opt"><input type="radio" name="cabinopt" value="${k}" ${k === S.cabin ? "checked" : ""} /> ${t}</label>`).join(""), true);
    el.onchange = e => { S.cabin = e.target.value; $("cabinVal").textContent = CABIN[S.cabin]; closePop(); };
  }

  // One click handler for every cell and button in the rows.
  $("rows").addEventListener("click", e => {
    if (e.target.closest(".pop")) return;
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const i = +t.dataset.leg || 0;
    switch (t.dataset.act) {
      case "swap": {
        e.stopPropagation();
        const L = S.legs[i]; [L.from, L.to] = [L.to, L.from]; renderRows(); break;
      }
      case "clear-ret": setTrip("oneway"); break;
      case "place": if (pop?.cell !== t) placePop(t, i, t.dataset.end); break;
      case "date": {
        closePop();
        const input = t.querySelector(".date-input");
        try { input.showPicker(); } catch (_) { input.focus(); }
        break;
      }
      case "pax": if (pop?.cell !== t) paxPop(t); break;
      case "cabin": if (pop?.cell !== t) cabinPop(t); break;
      case "rm-leg": S.legs.splice(i, 1); renderRows(); break;
      case "add-leg": {
        const last = S.legs[S.legs.length - 1];
        S.legs.push({ from: last.to, to: null, date: addDays(last.date, 2) }); renderRows(); break;
      }
    }
  });
  $("rows").addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches(".cell")) { e.preventDefault(); e.target.click(); }
  });
  $("rows").addEventListener("change", e => {
    const inp = e.target.closest(".date-input");
    if (!inp || !inp.value) return;
    if (inp.dataset.ret) { S.ret = inp.value; setTrip("round"); return; }
    const i = +inp.dataset.leg;
    S.legs[i].date = inp.value;
    for (let k = i + 1; k < S.legs.length; k++)          // keep later flights in order
      if (S.legs[k].date < S.legs[k - 1].date) S.legs[k].date = S.legs[k - 1].date;
    if (S.ret && S.ret < S.legs[0].date) S.ret = S.legs[0].date;
    renderRows();
  });

  // ---- search + results ----
  let offers = [], sortBy = "price", nonstopOnly = false, lastQuery = null;

  function buildLegs() {
    if (S.trip === "round")
      return [S.legs[0], { from: S.legs[0].to, to: S.legs[0].from, date: S.ret }];
    return S.legs;
  }
  function validate(legs) {
    for (const [k, l] of legs.entries()) {
      const n = legs.length > 1 ? ` for flight ${k + 1}` : "";
      if (!l.from || !l.to) return `Choose where you're flying from and to${n}.`;
      if (l.from.code === l.to.code) return `From and To can't be the same${n}.`;
    }
    if (S.trip === "round" && !S.ret) return "Choose a return date.";
    return null;
  }

  $("fx").onsubmit = async e => {
    e.preventDefault();
    closePop();
    const legs = buildLegs();
    const problem = validate(legs);
    if (problem) return showState(problem, true);

    const fare = document.querySelector("input[name=fare]:checked").value;
    lastQuery = { legs, pax: paxText(), cabin: CABIN[S.cabin], fare };
    $("searchBtn").disabled = true;
    $("searchBtn").textContent = "SEARCHING…";
    $("results").innerHTML = `<div class="state">Checking airlines… this can take up to 20 seconds.</div>`
      + '<div class="skel"></div>'.repeat(3);
    $("results").scrollIntoView({ behavior: "smooth", block: "start" });
    try {
      const r = await fetch("/api/flights/search", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          legs: legs.map(l => ({ origin: l.from.code, destination: l.to.code, date: l.date })),
          adults: S.adults, children: S.children, infants: S.infants, cabin: S.cabin, fare,
        }),
      });
      if (r.status === 401) { window.location.href = "/login"; return; }
      const d = await r.json();
      if (!r.ok) return showState(d.error || "Search failed.", true);
      offers = d.offers || [];
      renderResults();
    } catch (_) {
      showState("Couldn't reach the server. Is it still running?", true);
    } finally {
      $("searchBtn").disabled = false;
      $("searchBtn").textContent = "SEARCH";
    }
  };

  function showState(msg, isErr) {
    $("results").innerHTML = `<div class="card state"><span class="${isErr ? "err" : ""}">${esc(msg)}</span></div>`;
  }

  const hm = s => (s || "").slice(11, 16);                    // "2026-10-15T06:15:00" -> "06:15"
  const dur = m => m == null ? "" : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`;
  const dayDiff = (a, b) => Math.round((parse(b.slice(0, 10)) - parse(a.slice(0, 10))) / 864e5);
  const money = (n, cur) => {
    // en-IN gives Indian digit grouping for rupees: ₹1,23,456
    try { return new Intl.NumberFormat(cur === "INR" ? "en-IN" : undefined, { style: "currency", currency: cur, maximumFractionDigits: 0 }).format(n); }
    catch (_) { return `${cur} ${Math.round(n).toLocaleString()}`; }
  };

  function sliceHtml(s) {
    const segs = s.segments;
    const first = segs[0]?.carrier || {};
    const nums = segs.map(g => `${esc(g.carrier.code || "")} ${esc(g.flight_number || "")}`).join(" · ");
    const ops = [...new Set(segs.filter(g => g.operator?.name && g.operator.name !== g.carrier.name)
      .map(g => g.operator.name))];
    const logo = first.logo
      ? `<img src="${esc(first.logo)}" alt="" onerror="this.replaceWith(document.createTextNode('${esc(first.code || "")}'))" />`
      : esc(first.code || "✈");
    const plus = s.depart && s.arrive ? dayDiff(s.depart, s.arrive) : 0;
    const via = segs.slice(0, -1).map(g => g.destination.code).join(", ");
    const dots = segs.slice(0, -1).map((_, k) => `<i style="left:${((k + 1) / segs.length) * 100}%"></i>`).join("");
    return `<div class="sl">
      <div class="air"><span class="logo-b">${logo}</span>
        <div><div class="n">${esc(first.name || "Airline")}</div><div class="f">${nums}</div>
        ${ops.length ? `<div class="op">Operated by ${esc(ops.join(", "))}</div>` : ""}</div></div>
      <div class="times">
        <div><div class="tm">${hm(s.depart)}</div><div class="ap">${esc(s.origin.code)}</div></div>
        <div class="path"><div>${dur(s.duration_min)}</div><div class="ln">${dots}</div>
          <div class="st ${s.stops ? "" : "ns"}">${s.stops ? `${s.stops} stop${s.stops > 1 ? "s" : ""} · ${esc(via)}` : "Non-stop"}</div></div>
        <div class="end"><div class="tm">${hm(s.arrive)}${plus > 0 ? `<sup>+${plus}</sup>` : ""}</div><div class="ap">${esc(s.destination.code)}</div></div>
      </div></div>`;
  }

  function detailsHtml(o) {
    return o.slices.flatMap(s => s.segments).map(g => `<div class="dseg">
      <div><b>${esc(g.origin.code)} → ${esc(g.destination.code)}</b></div>
      <div class="c">${esc(g.carrier.name || "")} ${esc(g.carrier.code || "")} ${esc(g.flight_number || "")}${
        g.operator?.name && g.operator.name !== g.carrier.name ? ` · operated by ${esc(g.operator.name)}` : ""}</div>
      <div>${esc((g.depart || "").slice(0, 10))} · ${hm(g.depart)}–${hm(g.arrive)} · ${dur(g.duration_min)}</div></div>`).join("");
  }

  function renderResults() {
    const q = lastQuery;
    const route = S.trip === "round"
      ? `${q.legs[0].from.code} ⇄ ${q.legs[0].to.code}`
      : [q.legs[0].from.code, ...q.legs.map(l => l.to.code)].join(" → ");
    let list = offers.filter(o => !nonstopOnly || o.slices.every(s => s.stops === 0));
    const key = { price: o => o.price, duration: o => o.duration_min, depart: o => o.slices[0]?.depart || "" }[sortBy];
    list = [...list].sort((a, b) => key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0);

    const head = `<div class="res-head">
      <div><h2>${esc(route)}</h2>
        <div class="meta">${q.legs.map(l => shortDate(l.date)).join(" – ")} · ${esc(q.pax)} · ${esc(q.cabin)}${
          q.fare === "student" ? " · Student fare" : ""} · ${list.length} flight${list.length === 1 ? "" : "s"}</div></div>
      <div class="tools">
        <div class="seg" role="group" aria-label="Sort by">
          ${[["price", "Cheapest"], ["duration", "Fastest"], ["depart", "Earliest"]].map(([k, t]) =>
            `<button type="button" data-sort="${k}" class="${k === sortBy ? "on" : ""}">${t}</button>`).join("")}
        </div>
        <label class="chk"><input type="checkbox" id="nonstop" ${nonstopOnly ? "checked" : ""} /> Non-stop only</label>
      </div></div>`;

    const body = list.length ? list.map((o, k) => `<article class="card offer">
        <div class="slices">${o.slices.map(sliceHtml).join("")}</div>
        <div class="price"><div class="amt">${o.original_currency ? "≈ " : ""}${money(o.price, o.currency)}</div>
          <div class="per">total${paxTotal() > 1 ? ` · ${paxTotal()} travellers` : ""}</div>
          ${o.original_currency ? `<div class="orig" title="The airline charges in ${esc(o.original_currency)}; INR is an estimate at today's exchange rate">
            from ${money(o.original_price, o.original_currency)}</div>` : ""}</div>
        <button type="button" class="more" data-k="${k}" aria-expanded="false">Flight details ▾</button>
        <div class="details" hidden>${detailsHtml(o)}</div></article>`).join("")
      : `<div class="card state">${offers.length
          ? "No non-stop flights for this search. Untick “Non-stop only” to see connecting flights."
          : "No flights found for these dates. Try different dates or nearby airports."}</div>`;

    $("results").innerHTML = head + body;
    $("results").querySelectorAll("[data-sort]").forEach(b => b.onclick = () => { sortBy = b.dataset.sort; renderResults(); });
    $("nonstop").onchange = e => { nonstopOnly = e.target.checked; renderResults(); };
    $("results").querySelectorAll(".more").forEach(b => b.onclick = () => {
      const d = b.nextElementSibling, open = d.hidden;
      d.hidden = !open; b.setAttribute("aria-expanded", open);
      b.textContent = open ? "Hide details ▴" : "Flight details ▾";
    });
  }

  renderRows();

  function showView() {
    const id = location.hash.slice(1) || "flights";
    const cat = CATEGORIES.find(c => c.id === id) || CATEGORIES[0];
    document.querySelectorAll(".cat").forEach(a => a.classList.toggle("active", a.dataset.cat === cat.id));
    const soon = !!cat.soon;
    $("view-flights").hidden = soon;
    $("view-category").hidden = !soon;
    // On narrow screens the tab row scrolls; bring the selected tab into view.
    document.querySelector(`.cat[data-cat="${cat.id}"]`).scrollIntoView({ block: "nearest", inline: "center" });
    if (soon) {
      $("soonIco").innerHTML = svg(cat.icon);
      $("soonTitle").textContent = cat.label;
      $("soonText").textContent = cat.soon;
    }
    document.title = `${cat.label} · AI Travel Planner`;
    closePop();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", showView);

  // logout
  $("logout").onclick = async e => {
    e.preventDefault();
    await fetch("/api/logout", { method: "POST" });
    window.location.href = "/login";
  };

  showView();
</script>
</body>
</html>
