[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travel-planner"
version = "0.1.0"
description = "AI Travel Planner — flight search and more"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13",
    "python-dotenv>=1.2",
    "fastapi>=0.139",
    "uvicorn>=0.50",
    "pyjwt>=2.8",              # login tokens (JWT)
    "pymysql[rsa]>=1.1",       # MySQL driver; [rsa] adds cryptography for MySQL 8+/9 logins
]

[project.scripts]
travel-planner-web = "travel_planner.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_planner"]
